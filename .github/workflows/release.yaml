name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - name: "Set version number"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"' \
            "${{ github.workspace }}/custom_components/vtherm_auto_fan_extended/manifest.json"
      # Pack the HACS dir as a zip and upload to the release
      - name: ZIP Versatile Thermostat Dir
        run: |
          cd "${{ github.workspace }}/custom_components/vtherm_auto_fan_extended"
          zip vtherm_auto_fan_extended.zip -r ./
      - name: Upload zip to release
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: ${{ github.workspace }}/custom_components/vtherm_auto_fan_extended/vtherm_auto_fan_extended.zip
